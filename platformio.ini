; PlatformIO Project Configuration File
;
; --------------------------------------------------
;  j4_stepper / ESP32-DEV (WROOM)
;  Sole stepper board for Johnny 4 -- drives all five
;  steppers.
;    3x STEPPERONLINE DM556TE (neck left, right, pivot)
;    2x TMC2209 (eye-pop left, right)
;  Receives "nL,nR,nP,eye" from j4_receiver over UART1,
;  drives everything locally, and reports merged status
;  back upstream. (j4_stepper_eyes is retired.)
; --------------------------------------------------
[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
lib_deps =
    gin66/FastAccelStepper@^0.30.7
    teemuatlut/TMCStepper@^0.7.3
