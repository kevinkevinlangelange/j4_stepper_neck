; PlatformIO Project Configuration File
;
; --------------------------------------------------
;  j4_stepper_neck / ESP32-DEV (WROOM)
;  Neck stepper board for Johnny 4 and middle node of
;  the stepper daisy chain.
;    3x STEPPERONLINE DM556TE (neck left, right, pivot)
;  Receives "nL,nR,nP,eye" from j4_receiver over UART1,
;  drives the neck via step/dir, forwards the eye value
;  to j4_stepper_eyes over UART2, and reports merged
;  status back upstream. Six limit inputs, one per axis
;  endpoint.
; --------------------------------------------------
[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
lib_deps =
    gin66/FastAccelStepper@^0.30.7
