; PlatformIO Project Configuration File
;
; --------------------------------------------------
;  j4_stepper_neck / ESP32-DEV (WROOM)
;  Neck stepper board for Johnny 4 and middle node of
;  the stepper daisy chain.
;    3x TMC5160T (neck left, neck right, neck pivot)
;  Receives "nL,nR,nP,eye" from j4_receiver over UART1,
;  drives the neck, forwards the eye value to
;  j4_stepper_eyes over UART2, and reports merged
;  driver status back upstream.
; --------------------------------------------------
[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
lib_deps =
    gin66/FastAccelStepper@^0.30.7
    teemuatlut/TMCStepper@^0.7.3
