; PlatformIO Project Configuration File
;
; --------------------------------------------------
;  j4_stepper_v0_1 / ESP32-DEV (WROOM)
;  Dedicated stepper driver board for Johnny 4.
;  Receives ASCII position packets from j4_receiver
;  (TTGO) over UART and drives 5 stepper motors:
;    3x TMC5160T (neck left, neck right, neck pivot)
;    2x TMC2209  (eye-pop left + right, ganged)
;
;  Stepper library + settings match j4_receiver and
;  j4_motor_test_dev so the neck motion feels identical.
; --------------------------------------------------
[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
lib_deps =
    gin66/FastAccelStepper@^0.30.7
    teemuatlut/TMCStepper@^0.7.3
